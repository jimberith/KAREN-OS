[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karenos"
version = "0.1.0"
description = "A modular, laptop-first personal AI assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
ai = ["openai>=1.30"]
voice = ["pyttsx3>=2.90"]
vision = ["opencv-python>=4.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
karenos = "karenos.main:main"
karenos-camera = "karenos.vision.camera:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
